<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
    body { width: 360px; margin: 0; padding: 12px; box-sizing: border-box; }
    form { display: flex; flex-direction: column; gap: 8px; }
    textarea { resize: vertical; min-height: 60px; font: inherit; padding: 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    button { padding: 4px 14px; }
    #answer { margin-top: 10px; max-height: 400px; overflow-y: auto; line-height: 1.45; }
    #answer .error { color: #d33; white-space: pre-wrap; }
    #answer .q { font-weight: 600; margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid rgba(127, 127, 127, .3); white-space: pre-wrap; }
    #answer > :first-child { margin-top: 0; padding-top: 0; border-top: none; }
    #answer .a > :first-child { margin-top: 0; }
    #answer p, #answer ul, #answer ol, #answer pre { margin: 0 0 8px; }
    #answer ul, #answer ol { padding-left: 20px; }
    #answer li { margin: 2px 0; }
    #answer h3, #answer h4, #answer h5 { margin: 12px 0 6px; font-size: 14px; }
    #answer h5 { font-size: 13px; }
    #answer code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127, 127, 127, .15); padding: 1px 4px; border-radius: 4px; }
    #answer pre { background: rgba(127, 127, 127, .15); padding: 8px; border-radius: 6px; overflow-x: auto; }
    #answer pre code { background: none; padding: 0; }
    #answer hr { border: none; border-top: 1px solid rgba(127, 127, 127, .3); margin: 10px 0; }
    #answer a { color: #2a7ae2; }
  </style>
</head>
<body>
  <form>
    <label for="question">Вопрос про эту страницу</label>
    <textarea id="question" placeholder="Кратко перескажи…" autofocus></textarea>
    <div class="row">
      <select id="model" aria-label="Модель">
        <option value="haiku">Haiku: быстро</option>
        <option value="sonnet">Sonnet: умнее</option>
      </select>
      <button type="submit">Спросить ⌘↵</button>
    </div>
  </form>
  <div id="answer" aria-live="polite"></div>
  <script type="module" src="src/ui/popup.js"></script>
</body>
</html>
